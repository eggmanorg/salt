<!DOCTYPE html>
<html lang="en-GB">
<head><title>Before you continue to YouTube</title></head>
<body>
<!-- Hand-written stand-in for consent.youtube.com: a request from the EU/UK can
     be redirected here instead of being served the watch page. The shape that
     matters is what it lacks — no ytInitialPlayerResponse object. -->
<h1>Before you continue to YouTube</h1>
<p>We use cookies and data to deliver and maintain Google services.</p>
<form action="https://consent.youtube.com/save" method="POST">
  <input type="hidden" name="continue" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ&amp;cbrd=1">
  <button>Reject all</button><button>Accept all</button>
</form>
<script>window['ytInitialPlayerResponse'] = null; if (window.ytcfg) {ytcfg.set({"HL":"en-GB"});}</script>
</body>
</html>
