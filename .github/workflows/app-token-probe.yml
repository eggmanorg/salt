name: App token probe

# TEMPORARY diagnostic — mirrors pr-doc-review.yml's shape (checkout PR head,
# run claude-code-action, then push with the salt-autofix App token) to find
# why that job's push was denied on #1336. Delete once settled.

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'chore/app-token-probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - id: token-a
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - name: Push BEFORE claude-code-action
        env:
          TOKEN: ${{ steps.token-a.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail
          git config user.name "salt-autofix[bot]"
          git config user.email "salt-autofix[bot]@users.noreply.github.com"
          git commit --no-verify --allow-empty -m "chore: probe before"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:${HEAD_REF}" && echo "BEFORE PUSH OK" || echo "BEFORE PUSH DENIED"

      - name: Run claude-code-action (trivial)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Reply with the single word OK. Do not use any tools."
          claude_args: "--max-turns 1 --model sonnet"

      - name: Git state after the action
        if: always()
        run: |
          set -uo pipefail
          echo "--- local config ---"
          git config --local --list | sed 's/x-access-token:[^@]*@/x-access-token:HIDDEN@/g'
          echo "--- includes ---"
          git config --local --get-all include.path || true
          echo "--- remotes ---"
          git remote -v | sed 's/x-access-token:[^@]*@/x-access-token:HIDDEN@/g'

      - id: token-b
        if: always()
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - name: Push AFTER claude-code-action — to the PR head branch
        if: always()
        env:
          TOKEN: ${{ steps.token-b.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail
          git config user.name "salt-autofix[bot]"
          git config user.email "salt-autofix[bot]@users.noreply.github.com"
          git commit --no-verify --allow-empty -m "chore: probe after"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:${HEAD_REF}" && echo "AFTER PUSH OK" || echo "AFTER PUSH DENIED"
