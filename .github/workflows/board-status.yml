name: Board status

# Move an issue along the pipeline on the board ("Salt — The Pass", org project #1)
# whenever an EVENT already proves the move. Three of the six transitions are
# observable; the other three are not, and are set by the agent commands instead:
#
#   Triage      — GitHub's own "Item added to project" project workflow. That is a
#                 UI SETTING on the project, not code, and it was switched OFF for
#                 weeks while this comment claimed otherwise — new issues arrived
#                 with no Status at all. `board.mjs check` now asserts it is on
#                 rather than trusting this sentence; see docs/issue-board.md.
#   Todo        — a decision. /triage or Daniel. No event exists for "I have decided".
#   In progress — /salt-run, when the worktree is cut, AND HERE for the two kinds
#                 of issue no worktree is ever cut for: a campaign ledger the
#                 moment it opens, and a multi-item issue the moment one of its
#                 boxes is ticked. A branch push is far too noisy to key on, and
#                 a draft PR is raised much later. `scripts/lib/boardProgress.mjs`
#                 holds what counts as started and what this cannot see.
#   In review   — HERE. A pull request opened, or taken out of draft.
#   Merged      — HERE. That pull request merged. Staging follows on its own
#                 (deploy-staging.yml runs on CI-green main), so there is no
#                 separate staging state to track.
#   Released    — HERE. A production deploy succeeded AND the issue's merge
#                 commit is an ancestor of the deployed sha. See below.
#
# A seventh move is not a status at all: when an issue closes, the checklist it
# hangs off gets its line ticked, and closes itself once every line is ticked and
# every sibling is closed — as does a campaign ledger once everything its title
# names is closed, and each such close carries on up. `scripts/lib/boardRollup.mjs`
# holds what that cannot see; the `rolled-up` job below holds why it needs two
# tokens.
#
# The issue→PR link is the `Closes #N` that /salt-run writes into every PR body. That
# is not a convention this workflow invented: GitHub's own "linked issue" is
# derived from the same text, so anything that closes an issue on merge is
# already saying it here.
#
# WHY `Released` IS NOT SIMPLY "everything Merged": production deploys a TAG, and
# `Merged` only means "on main". Between a release tag being cut and its
# approval-gated deploy finishing, more can land on main — marking those live
# would be a lie the board tells about production. `board.mjs release` therefore
# tests `git merge-base --is-ancestor <merge commit> <deployed sha>` per issue,
# which is why that job needs `fetch-depth: 0`.
#
# TOKEN: the Actions GITHUB_TOKEN cannot write Projects v2 at any permission
# level — org projects are outside the repo-scoped token entirely. PROJECT_TOKEN
# is a fine-grained PAT with read/write on the org's projects and read on issues.
# Without it these jobs fail loudly rather than silently skipping, because a
# board that is quietly out of date is worse than one that is visibly broken.

on:
  issues:
    types: [opened, edited, closed]
  pull_request:
    types: [opened, ready_for_review, closed]
  workflow_run:
    workflows: ['Deploy Production']
    types: [completed]

# Never let two board writers race on the same issue. An `issues` run is keyed
# separately from a `pull_request` one because the two number spaces overlap and
# name different things — a PR and an issue sharing a number are not the same
# item, and sharing a group would serialise them for no reason.
concurrency:
  group: >-
    board-status-${{ github.event_name == 'issues' && format('issue-{0}',
    github.event.issue.number) || github.event.pull_request.number ||
    github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs on EVERY issue open and EVERY body edit in the repo, and moves nothing
  # for almost all of them — `board.mjs start` is guarded on both sides and says
  # which guard stopped it. Deliberately cheap rather than clever: the
  # alternative is teaching YAML which bodies and which statuses qualify, in a
  # job that holds PROJECT_TOKEN, when the script already knows.
  #
  # The body is never read from the webhook payload and never interpolated into
  # `run:` — an issue body is attacker-supplied text, and this job holds the PAT.
  # `board.mjs start` fetches it over GraphQL from the number alone, the same way
  # spec-shape.yml deliberately re-fetches rather than trusting the payload.
  started:
    name: Work started → In progress
    if: github.event_name == 'issues' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/board.mjs start ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}

  # A closed sub-issue → the checklist that asked for it.
  #
  # `/salt-campaign` files a `campaign follow-ups:` issue and deliberately leaves
  # it open; nothing afterwards ticks its lines or closes it when the last child
  # lands. #1335 sat open for two days with all three children closed. This is
  # the event that proves the move, and it is the only one there is.
  #
  # TWO TOKENS, and neither will do on its own. PROJECT_TOKEN writes the project
  # field and can only READ issues; the Actions GITHUB_TOKEN writes the issue and
  # cannot touch an org project at all. `board.mjs rollup` takes the issue half
  # as ISSUE_WRITE_TOKEN. A GITHUB_TOKEN-authored close raises no further
  # `issues` event by design, so the cascade up to a grandparent, or to the
  # ledger above a follow-ups issue, happens inside that one `board.mjs rollup`
  # process rather than through another run of this job (#1606).
  #
  # Like `started`, this never reads the payload's body text: `board.mjs` fetches
  # both issues over GraphQL from the number alone, in a job holding the PAT.
  rolled-up:
    name: Sub-issue closed → tick its parent
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/board.mjs rollup ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_WRITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # BOTH pull_request jobs skip Dependabot's own PRs. A run triggered by
  # Dependabot reads GitHub's separate Dependabot secrets store, so
  # `secrets.PROJECT_TOKEN` arrives empty and board.mjs dies on its first API
  # call. That is a red check on a PR that was never going to move anything: a
  # dependency bump closes no issue, so it has no board item. The guard is on
  # the PR's author, not `github.actor` — on `closed` the actor is whoever
  # merged it, which for an auto-merged bump is not Dependabot.
  in-review:
    name: PR raised → In review
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed'
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/board.mjs pr ${{ github.event.pull_request.number }} --status "In review"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}

  merged:
    name: PR merged → Merged
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.merged
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/board.mjs pr ${{ github.event.pull_request.number }} --status "Merged"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}

  released:
    name: Deployed to production → Released
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # DO NOT add `ref: …head_sha` here. `workflow_run` is a PRIVILEGED trigger
      # — this job holds PROJECT_TOKEN — so checking out the deployed ref and
      # then running a script from it executes whatever that ref contains with
      # the token in scope (CodeQL actions/untrusted-checkout/high). Checking out
      # the default branch instead is also simply more correct: board.mjs should
      # be the current one, not whatever shipped in the tag being announced.
      #
      # fetch-depth: 0 pulls all history and tags, so the deployed sha is present
      # for the ancestry test even though it is not what is checked out.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/board.mjs release --sha "${{ github.event.workflow_run.head_sha }}"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
