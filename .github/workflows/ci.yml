name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue. GitHub builds each queued PR onto the CURRENT main on a
  # `gh-readonly-queue/main/...` ref and runs this workflow there, so the
  # semantic collision that "require branches to be up to date" exists to
  # catch — two PRs each green apart, broken together — is caught in the
  # queue instead of by a hand-driven "Update branch" round-trip, and never
  # on main itself.
  #
  # The trigger is on the WORKFLOW, not on individual jobs, and it has to
  # stay that way: every required status check in the "Main branch" ruleset
  # lives in this file, and a required context that never reports on a
  # merge_group event blocks the queue forever.
  merge_group:

permissions:
  contents: read
  actions: read

# Cancel a PR's in-flight run when a new commit supersedes it. Nothing is
# learned from finishing a run against code that has already been replaced, and
# the freed runners go to the run that matters. This — not gating the heavy
# suites behind the cheap ones — is the right way to stop wasting capacity: it
# reclaims work that has become POINTLESS, without delaying work that is still
# useful (see the comment on vitest-integration).
#
# NEVER cancels a push to main: each main commit's run is the staging-deploy gate
# (deploy-staging.yml fires on this workflow's completion), so cancelling one
# would silently skip a deploy.
#
# Nor a merge_group run: a queue entry is a merge candidate, and GitHub already
# cancels its runs itself when it re-forms the batch. Each entry gets its own
# `gh-readonly-queue/main/pr-N-<sha>` ref, so the group key never collides with
# a PR's run or with main's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether the change under test touches app code — a PR's diff, or a
  # merge-queue batch's. The heavy emulator + Playwright suites are skipped for
  # non-app changes (docs / CI / tooling — see the allowlist below), but this
  # workflow still TRIGGERS on every PR and every queue entry so the required
  # status checks report (a skipped required job passes; an un-triggered one
  # would block merge forever waiting on a context that never appears).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      uptodate: ${{ steps.detect.outputs.uptodate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          # Which two commits bound "the change under test" depends on the event:
          #   pull_request — the PR's base..head.
          #   merge_group  — the queue candidate's base..head, i.e. every PR in
          #                  the batch stacked on current main. Diffing those
          #                  keeps the non-app allowlist working in the queue, so
          #                  a docs-only PR still skips the heavy suites there
          #                  rather than paying for them twice.
          #   push to main — nothing to compare against, and main is the deploy
          #                  source that must stay genuinely green: full suite.
          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
              ;;
            merge_group)
              BASE_SHA="$MG_BASE_SHA"
              HEAD_SHA="$MG_HEAD_SHA"
              ;;
            *)
              echo "Event '$EVENT_NAME' is neither pull_request nor merge_group — running full CI."
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "uptodate=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"

          # Non-app allowlist. These paths cannot change the runtime behaviour
          # of the app, so the heavy emulator + Playwright suites (which only
          # exercise app behaviour) are pure waste for them:
          #   - docs/, *.md, LICENSE        — documentation
          #   - .github/                    — CI / dependabot config
          #   - .claude/                    — AI-agent tooling (commands, settings)
          #   - .vscode/, .editorconfig,
          #     .nvmrc, .gitignore,
          #     .vexpignore                 — editor / meta dotfiles
          # Anything NOT matched here counts as code and triggers the full
          # suite, so a mixed code+non-app PR runs everything. Conservative by
          # design. Lint/typecheck/unit/boundary (the `ci` job) always run
          # regardless — only the heavy suites are gated.
          #
          # Caveat: a change to the e2e / vitest-integration job setup *inside*
          # .github/workflows/ci.yml will itself skip those suites, so such a
          # change cannot be validated green by this run — verify it on a
          # follow-up PR that also touches app code.
          non_app=$(echo "$changed" | grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/|\.claude/|\.vscode/|\.editorconfig$|\.nvmrc$|\.gitignore$|\.vexpignore$)' || true)

          if [ -n "$non_app" ]; then
            echo "App-impacting changes detected — running full CI."
            code=true
          else
            echo "Non-app change (docs / CI / tooling) — skipping emulator + e2e suites."
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

          # Up-to-date gate — pull_request only. Running the heavy emulator +
          # Playwright suites on a branch that is behind origin/main tells you
          # about a combination that will never be merged, so when behind we
          # mark uptodate=false and the heavy jobs skip (a skipped required
          # check passes).
          #
          # This is safe BECAUSE of the merge queue, not in spite of it: the
          # queue re-runs this workflow on the PR restacked onto current main,
          # which is up to date by construction, so the suites the PR run
          # skipped are the very ones the queue run executes for real. Before
          # the queue, the same skip leaned on the "Main branch" ruleset being
          # strict (a behind-branch had to rebase, re-triggering CI); it stays
          # correct under either configuration, and correct for the right
          # reason under the queue.
          #
          # A merge_group run is never gated: its head IS main plus the batch.
          # Only meaningful when code=true (the heavy suites would otherwise run).
          uptodate=true
          if [ "$code" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin main
            if git merge-base --is-ancestor FETCH_HEAD "$HEAD_SHA"; then
              echo "Branch is up to date with origin/main — heavy suites will run."
            else
              echo "Branch is behind origin/main — the merge queue will run the heavy suites against real main; skipping them this run."
              uptodate=false
            fi
          fi
          echo "uptodate=$uptodate" >> "$GITHUB_OUTPUT"

  # The cheap checks are split across three PARALLEL jobs (static / types /
  # unit) rather than run as one serial job, because they are independent and
  # the serial job had become the critical path: ~4m15s, of which the unit
  # suite alone was ~2m26s while the runner sat mostly idle for the rest. Split,
  # the wall clock is the slowest job instead of the sum.
  #
  # `ci` below is a no-op AGGREGATOR that gates on all three. It exists purely to
  # keep the job name "Lint, typecheck, test, boundary" in the graph: that exact
  # string is a REQUIRED status check in the "Main branch" ruleset, so renaming
  # or removing it would leave every PR waiting forever on a context that never
  # reports. Splitting further (or renaming these jobs) needs no ruleset change
  # as long as the aggregator keeps that name and keeps gating on everything.
  #
  # NOTHING depends on `ci` any more — it reports, it does not gate. The heavy
  # suites deliberately run concurrently with these checks rather than behind
  # them; see the comment on vitest-integration for why.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/workspace

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Boundary tests
        run: pnpm boundary:test

      # dependency-cruiser over the REAL tree (packages + apps). boundary:test
      # only cruises the circular fixture, and eslint-plugin-boundaries can't see
      # depcruise-only rules (no-cycles, resolved-path subpath checks,
      # no-import-web-pwa). The pre-commit runs the same `depcruise` script, but
      # that is bypassable (--no-verify) and never runs for bot/web-UI commits —
      # this is the CI backstop (issue #413). Cheap, no emulator.
      - name: Dependency cruiser (import graph)
        run: pnpm depcruise

      - name: Provenance check
        run: pnpm provenance:check

      - name: Theme check
        run: pnpm theme:check

      # Docs map hygiene. `docs/` is not auto-loaded, so `docs-map.md` is
      # the ONLY index of it — a doc missing from the map is invisible to every
      # agent, and a row whose glob has gone dead reads as covered while routing
      # nothing. Both are whole-repo facts that per-PR doc review structurally
      # cannot see. Deterministic and free, so it runs here rather than costing
      # model turns. A step in `static`, never a new job: the ruleset's three
      # required contexts must stay three.
      - name: Docs map check
        run: pnpm docsmap:check

      # Type scale. The scale bottoms out at 12px, and nothing enforced it: the
      # #894 review counted 14 hand-written smaller sizes, and a week later 17 —
      # two of them inside the design system itself. A sweep buys one clean
      # reading; this is what holds it. Same reasoning as the two above:
      # deterministic, free, and a whole-repo fact per-PR review cannot see.
      - name: Type scale check
        run: pnpm typescale:check

      # Raw palette. Same shape as the type scale above, and a script rather than
      # a lint rule for the same reason: nothing in the toolchain reads a class
      # string, which is how 130 raw amber occurrences accumulated across 27
      # files spelling out a colour vocabulary no token named (#993). Naming them
      # was not enough on its own — CLAUDE.md rule 12 — so this is what stops the
      # finding regrowing. Scans `.ts` as well as `.svelte`, and `var(--color-*)`
      # as well as class names; the group-C exceptions are an explicit allowlist
      # with reasons, not an omission.
      - name: Raw palette check
        run: pnpm palette:check

      # Context budget. CLAUDE.md is auto-loaded into every session and every
      # subagent, so its size is a tax on all of them — and it grew 2.3 KB →
      # 43.6 KB over four months with nothing ever pushing content back out.
      # The cap forces the placement question (code comment / nested CLAUDE.md /
      # doc + map row) at the moment someone adds. Same reasoning as the docs map
      # above: deterministic, free, and invisible to per-PR review.
      - name: Context budget check
        run: pnpm context:check

      # Merge-queue integrity. The queue waits on the ruleset's required status
      # checks reporting against a `gh-readonly-queue/main/...` ref; a context
      # that never reports there does not fail an entry, it leaves it pending
      # until the check timeout and then ejects it — silently, for every PR.
      # ci.yml's `on:` block asserts that cannot happen, and this is what makes
      # the assertion true. Deterministic and free, so it belongs beside the two
      # checks above rather than costing model turns. A step in `static`, never a
      # new job: the ruleset's three required contexts must stay three.
      - name: Merge queue check
        run: pnpm mergequeue:check

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/workspace

      - name: Typecheck
        run: pnpm typecheck

      # svelte-check covers what lint + typecheck structurally cannot: type/prop
      # errors inside .svelte template markup (e.g. a renamed/removed prop on a
      # bits-ui component). `pnpm lint` globs *.{ts,js} only and `tsc --build`
      # does not parse .svelte, so a breaking UI-primitive API change can
      # otherwise pass fully green (see #390, follow-up to the bits-ui v1→v2 bump
      # in #380). Ungated like the rest of these jobs — it's cheap type-checking.
      # `pnpm check` fans out (`pnpm -r --if-present check`) to every package
      # with a `check` script — @salt/ui-components (#395) and apps/web-pwa
      # (#396) today. Add a `check` script to a new package to enrol it.
      - name: Svelte check
        run: pnpm check

  # Runs the unit suite UNDER COVERAGE, and the per-area thresholds in the root
  # `vitest.config.ts` turn the report into a blocking ratchet (issue #943).
  #
  # Coverage used to be its own job gated `if: github.event_name != 'pull_request'`
  # — it measured, uploaded a 14-day artifact, and failed nothing, so a PR could
  # drop an area's coverage and nothing would say so. That is exactly the wrong
  # posture in front of #913's behaviour-preserving refactor.
  #
  # Folded into `unit` rather than added ALONGSIDE it, on measurement: the suite
  # is 33.0 s and 39.3 s under `--coverage` (5,845 tests, same machine) — a 6.3 s,
  # ~19% delta. A separate job would re-pay checkout + workspace setup to re-run
  # the identical 5,845 tests for a saving of six seconds, so running the suite
  # twice per PR is not worth it. Keeping the job id `unit` also leaves the `ci`
  # aggregator's `needs` list — and therefore the required status contexts —
  # untouched.
  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/workspace

      - name: Test with coverage
        run: pnpm test:coverage

      # A floor is only as trustworthy as the file set behind it, and a file the
      # v8 remapper cannot parse is dropped from that set with nothing but a
      # stack trace above the table — 37 of them were, on every run, for as long
      # as the floors had existed (issue #974). This proves the report covered
      # every file `coverage.areas.mjs` names.
      #
      # `always()` for the same reason as the upload below: a dropped file is one
      # of the things that MOVES a threshold, so the run where a threshold failed
      # is exactly the run where this answer is worth having. It stands down
      # quietly when the suite never got far enough to write a report.
      - name: Coverage file-set guard
        if: always()
        run: pnpm coverage:files:check

      # The half of the ratchet vitest cannot enforce (issue #1133): per-area
      # uncovered-count CEILINGS, which catch a dedup that lowers a ratio
      # without lowering coverage, and a STALENESS red when an area has drifted
      # more than a point above its floor without anyone banking it.
      #
      # A step in this job rather than a job of its own, for the reason in the
      # header above: it reads the report `pnpm test:coverage` just wrote, and a
      # separate job would re-pay checkout + setup to re-run 7,281 tests to
      # produce it again. The job id stays `unit`, so no required status context
      # changes and the `ci` aggregator's `needs` list is untouched.
      #
      # `always()` for the same reason as the guard above: a threshold failure
      # and a ceiling breach are usually the same PR, and knowing both on the
      # first red run is the whole point. It stands down quietly with exit 0
      # when the suite never got far enough to write a report.
      - name: Coverage ratchet guard
        if: always()
        run: pnpm coverage:ratchet:check

      # `always()` so a THRESHOLD failure still ships the report — the whole point
      # of the artifact is diagnosing which files lost coverage, and that is
      # needed precisely on the runs that go red.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/unit/
          retention-days: 14

  # The only PRODUCTION BUILD in CI (issue #813). Two things it catches, neither
  # of which anything else here can:
  #
  # 1. A boot-payload regression. #813 took what the PWA downloads before first
  #    paint from 599 kB gzipped to 479 kB by getting the Lucide barrel and the
  #    browser OTel SDK out of it, and by making Leaflet load on demand. Each of
  #    those comes back via a one-line change with NO visible symptom — the app
  #    just opens slower, on every first load and after every PWA update. The
  #    script's header documents the three rules and how to move a ceiling.
  # 2. A broken `vite build`. Nothing else in CI builds the app, so until now a
  #    build break could only surface at deploy time.
  #
  # Its OWN JOB rather than a step in `static`: a build is ~2 min of work that has
  # no reason to sit in front of the cheap checks, and the aggregator below gates
  # on it either way. That keeps the ruleset's three required contexts at three —
  # the constraint the `static` comment is really about.
  #
  # Production mode on purpose: it is what ships, and `.env.production` is tracked
  # (the Firebase browser keys in it are public by design), so this needs no
  # secrets and runs on forks.
  boot-payload:
    name: Boot payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/workspace

      - name: Build web-pwa (production)
        run: pnpm --filter @salt/web-pwa build

      - name: Check boot payload
        run: node scripts/check-boot-payload.mjs

  # Aggregator — see the comment on `static`. MUST stay named
  # "Lint, typecheck, test, boundary" to satisfy the branch ruleset.
  ci:
    name: Lint, typecheck, test, boundary
    runs-on: ubuntu-latest
    needs: [static, types, unit, boot-payload]
    # `always()` because a plain `needs` would SKIP this job when a dependency
    # fails — and GitHub counts a skipped required check as PASSING, which would
    # turn the ruleset into a rubber stamp. It runs unconditionally and asserts
    # the results itself.
    if: always()
    steps:
      - name: Verify every check passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$bad" ]; then
            echo "::error::Did not succeed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "All checks passed."

  # Isolated Vitest emulator integration stack (issue #84, Phase 3/4).
  # Firestore+Auth-only composed stack on its own project/ports
  # (docker-compose.vitest.yml, project salt-vitest-emulators, 8082/9101).
  # scripts/test-emulator.mjs owns the full lifecycle: down -v -> up --wait
  # (healthcheck-gated) -> run suites -> always down -v in a finally. No Java,
  # no CF prebuild, no Playwright.
  #
  # NOT gated behind `ci`, deliberately. It used to be, "so the heavy emulator
  # suites only start once the cheap checks pass" — but that gate never made a
  # failure arrive sooner. A lint error already turns `Static checks` red at ~41s
  # whether or not the heavy suites are held back; all the gate did was add the
  # full length of the cheap checks (~2m30) to every GREEN run, which is the
  # common case. What it bought in exchange was unused runner-minutes, and this
  # repo is public, so those are free. The `concurrency` block at the top of this
  # file reclaims the genuinely wasted capacity — superseded PR runs are now
  # cancelled — which is what the gate was really reaching for.
  #
  # Runs CONCURRENTLY with e2e: the #84 "never concurrent" rule is a SINGLE-HOST
  # constraint (local dev runs both stacks on one machine). In CI each job gets
  # its own ubuntu-latest runner, so the two composed stacks never share
  # ports/volumes/Docker state — the structural isolation (distinct project +
  # ports 8082/9101 vs 8081/9100) is belt-and-suspenders here. They stay
  # non-concurrent for LOCAL runs only.
  #
  # Skipped (→ passes as a required check) for non-app PRs (docs / CI / tooling)
  # and for branches behind origin/main (strict ruleset forces a rebase that
  # re-triggers CI — see the `changes` job's uptodate gate).
  vitest-integration:
    name: Vitest integration (emulator)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.uptodate == 'true' }}
    # A healthy run is ~1.5 min of JOB wall-clock — measured 85–109 s across the
    # seven successful runs of 2026-09-01 (33484861527, 33485167582, 33486073878,
    # 33486619970, 33493653360, 33496275457, 33502165236). Job, not step, because
    # `timeout-minutes` bounds the job: the ~47 s quoted on #1150 is the `Run
    # Vitest emulator integration suites` step alone. Both are true; only this one
    # is what the bound is sized against. Nothing re-measures it, so read it as of
    # that date, not as a live figure. Without a bound a wedged `up --wait` or a
    # stalled registry fetch sits on GitHub's 6-hour default (issue #580).
    timeout-minutes: 25
    # Job-level permissions REPLACE the workflow-level block, so contents must be
    # restated. packages:read is for pulling the prebuilt emulator image.
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/emulator-image

      - uses: ./.github/actions/workspace

      # `pnpm test:emulator` = node scripts/test-emulator.mjs: brings up the
      # composed Vitest stack healthcheck-gated and always tears it down with
      # `down -v` in a finally. Docker is preinstalled on ubuntu-latest.
      # firebase-sync/.env.test is committed, so checkout is all CI needs to
      # retarget the client SDK to ports 8082/9101.
      - name: Run Vitest emulator integration suites
        run: pnpm test:emulator

  # ── E2E ─────────────────────────────────────────────────────────────────────
  # Split across 3 parallel shards, and — like vitest-integration — NOT gated
  # behind `ci`. Same reasoning: the gate never made a red build arrive sooner,
  # it only delayed green ones. See the comment on vitest-integration.
  #
  # ONE job covers both events. The `changes` job short-circuits to
  # code=true / uptodate=true for anything that is not a pull_request, so this
  # condition means "app-impacting PR that is up to date with main" pre-merge and
  # simply "always" post-merge — no second job, and no event branching here.
  #
  # SHARDING IS SAFE HERE, and the reason is specific: `workers: 1` in
  # playwright.config.ts is NOT a performance choice — all Salt data is
  # family-shared (no per-user scoping on any collection), so two tests hitting
  # one emulator would collide on the same shopping list / canon. That constraint
  # is per EMULATOR STACK, and every shard is a separate runner with its own
  # composed stack on its own ports. Shards therefore never share Firestore
  # state, exactly as this job and vitest-integration already don't. Do NOT
  # "optimise" this by raising `workers` within a shard — that breaks the
  # invariant. `--shard` splits at FILE granularity, so a spec file always runs
  # whole, on one runner, against one emulator.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.uptodate == 'true' }}
    # A healthy shard is ~3.5 min. Without a bound a stalled registry fetch or a
    # wedged `up --wait` sits on GitHub's 6-hour default — run 30087640130 ran
    # 22+ minutes without reaching a single test (issue #580).
    timeout-minutes: 20
    # Job-level permissions REPLACE the workflow-level block, so contents must be
    # restated. packages:read is for pulling the prebuilt emulator image.
    permissions:
      contents: read
      packages: read
    strategy:
      # One shard failing must not cancel the others: a red build should report
      # every failure it has, not just the first shard to trip.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/emulator-image

      - uses: ./.github/actions/workspace

      # setup-node's `cache: pnpm` covers the pnpm store, NOT ~/.npm — and the
      # Cloud Functions deploy bundle is installed with npm (it must be: the
      # generated dist/package.json is a plain manifest that Cloud Build installs
      # the same way). Keyed on the source manifest because dist/package.json is
      # derived from it by scripts/write-deploy-package.mjs.
      - name: Cache npm registry cache (Cloud Functions deploy bundle)
        id: npm-cf-cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-cf-bundle-${{ runner.os }}-${{ hashFiles('apps/cloud-functions/package.json') }}
          restore-keys: |
            npm-cf-bundle-${{ runner.os }}-

      # globalSetup builds the Cloud Functions deploy bundle, whose
      # `npm install --prefix dist` fetches 259 packages on every run. With the
      # ~/.npm cache restored above, prefer-offline serves them from disk instead
      # of round-tripping the registry — that install took 8 MINUTES (vs 11s
      # healthy) on run 30087640130. Set here rather than as a flag in the shared
      # `build` script on purpose: the deploy workflows must keep resolving
      # version ranges against the live registry.
      #
      # Gated on an EXACT key hit, because prefer-offline is force-cache: npm
      # serves a cached packument without revalidating it. On an exact hit that
      # is free — the manifest is unchanged, so the cache provably holds every
      # version we are about to ask for. On a restore-key fallback the manifest
      # HAS changed, and a bumped firebase-admin / firebase-functions / sharp
      # range then resolves against a packument captured before that version was
      # published: npm reports `ETARGET  No matching version found` for a package
      # that has been on the registry for a week, and never refetches to find
      # out otherwise. That red is the dependency bump's only symptom, so it
      # reads as "the bump is broken" — it took down every e2e shard on #704
      # (firebase-functions 7.3.2, published 8 days earlier). Falling back to
      # npm's default cache mode still reuses the ~50 MB of cached tarballs; it
      # only pays for revalidating metadata.
      - name: Enable npm prefer-offline (exact cache hit only)
        run: echo "npm_config_prefer_offline=${{ steps.npm-cf-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"

      # The browser binaries are a function of the RESOLVED Playwright version and
      # nothing else, so that is the cache key. It used to be
      # `hashFiles('pnpm-lock.yaml')`, which evicted the browsers on ANY dependency
      # change anywhere in the workspace — every Dependabot bump included. A miss
      # falls into the `install --with-deps` branch below, which cost 10m22s on run
      # 30092606787 (vs 15s warm) and was the whole reason that run took 18 minutes.
      - name: Resolve Playwright version
        id: pw
        run: |
          set -euo pipefail
          version=$(pnpm --filter @salt/web-pwa exec node -p "require('@playwright/test/package.json').version")
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `install-deps` runs `apt-get update`, and that is the single most likely
      # thing in this job to hang forever. The Azure mirror is `Ign`'d on every
      # runner, healthy or not, so apt always falls back to archive.ubuntu.com —
      # and some runners open that connection and never receive a byte. It stalls
      # mid-`InRelease`, silently, with no output and no error. Unbounded, that
      # burns the entire 20-minute job budget and surfaces as a red E2E shard,
      # which reads as "the diff broke the tests". Three consecutive re-runs of
      # #856 died exactly this way (run 32294942409, all three attempts, always
      # after `Get:5 archive.ubuntu.com noble-security InRelease`), as did an
      # unrelated PR in the same hour. GitHub declared no incident. A healthy
      # runner finishes this in 1-2 minutes, so anything past 3 is the hang.
      #
      # The two branches fail differently on purpose:
      #
      #   cache HIT  — apt is the only thing this step does, and the runner image
      #     already ships chromium's shared libraries. So bound each try and retry
      #     (a fresh apt re-resolves DNS and usually lands on a different archive
      #     IP); if all three still hang, that is a WARNING and the shard carries
      #     on. If a library genuinely is missing, the browser launch fails within
      #     seconds and names it — a far better red than a 20-minute timeout.
      #
      #   cache MISS — the same command also downloads the browsers (10m22s on run
      #     30092606787), so the job budget has no room for a second attempt, and
      #     without browsers nothing can run. One try, generous bound, fatal.
      - name: Install Playwright browsers
        run: |
          set -uo pipefail

          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            status=0
            timeout 840 pnpm --filter @salt/web-pwa exec playwright install --with-deps chromium || status=$?
            if [ "$status" -ne 0 ]; then
              if [ "$status" -eq 124 ]; then
                echo "::error::playwright install --with-deps timed out after 840s (hung apt mirror or slow browser download)."
              else
                echo "::error::playwright install --with-deps failed with status $status."
              fi
              exit "$status"
            fi
            exit 0
          fi

          for attempt in 1 2 3; do
            status=0
            timeout 180 pnpm --filter @salt/web-pwa exec playwright install-deps chromium || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 124 ]; then
              echo "::warning::install-deps timed out after 180s (attempt $attempt/3) — apt is hung, most likely on archive.ubuntu.com."
            else
              echo "::warning::install-deps failed with status $status (attempt $attempt/3)."
            fi
            sleep 5
          done

          echo "::warning::apt never completed after 3 attempts. Continuing on the cached browsers and the runner image's preinstalled chromium libraries — if one is actually missing, the browser launch below will fail in seconds and name it."

      # globalSetup.ts owns the whole lifecycle (issue #84, Phase 2): it builds
      # the Cloud Functions bundle, then `docker compose ... up --wait` brings
      # up the healthcheck-gated emulator stack (the gate replaces the old 120s
      # trigger-registration poll), and spawns the e2e Vite server on :5174.
      # No host Java / firebase-emulator cache / manual Vite — emulators are
      # containerized (jars baked into the image). CI=true makes globalTeardown
      # run `docker compose ... down -v`, reaping the whole process tree.
      #
      # The gating projects are named EXPLICITLY. Without `--project`, Playwright
      # runs every project in the config — including `quarantine`, whose whole
      # purpose is to not gate the merge (issue #721). Adding a project to
      # playwright.config.ts does not enrol it here; that is deliberate.
      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        run: pnpm --filter @salt/web-pwa exec playwright test --shard=${{ matrix.shard }}/3 --project=chromium --project=mobile-touch

      # Quarantined tests (issue #721): still run, still report to PostHog, no
      # longer gate — `continue-on-error` is that second half. A known-flaky test
      # left in the gate trains everyone to re-run on amber, which is how the NEXT
      # flake gets lost; a quarantined one is a bug still owed a fix, and its
      # PostHog history is how you tell whether the fix landed.
      #
      # Shard 1 only, and skipped entirely when nothing is tagged, because a second
      # Playwright invocation re-runs globalSetup — and in CI globalTeardown has
      # already torn the emulator stack down with `down -v`, so that means bringing
      # the whole stack back up. Two to three minutes on every PR to run an empty
      # set is not a price worth paying for a mechanism that usually has no members.
      - name: Run quarantined E2E tests (non-gating)
        if: matrix.shard == 1
        continue-on-error: true
        env:
          EVENTS: apps/web-pwa/e2e-flake-events.ndjson
          # The reporter OVERWRITES its output file, so a second Playwright run
          # writing to the default path would erase the gating run's records —
          # which the PostHog step below still has to ship. Point this run at its
          # own file (the reporter's documented override) and append instead.
          E2E_FLAKE_NDJSON: /tmp/e2e-flake-events-quarantine.ndjson
        run: |
          set -euo pipefail
          if ! grep -rq '@quarantine' apps/web-pwa/e2e --include='*.spec.ts'; then
            echo "::notice::No @quarantine-tagged tests — skipping the quarantine run."
            exit 0
          fi
          status=0
          pnpm --filter @salt/web-pwa exec playwright test --project=quarantine || status=$?
          cat "$E2E_FLAKE_NDJSON" >> "$EVENTS" 2>/dev/null || true
          exit "$status"

      # `always()`, and that is the entire point (issue #669). The artifacts below
      # are `failure()`-only, so the FLAKY signal — failed once, passed on the
      # retry — used to be discarded on every green run, and workflow logs expire
      # after ~8 days, so the history that shows when a test started rotting was
      # gone before anyone went looking. PostHog is the durable store; the
      # reporter (e2e/reporter/flakeReporter.ts) already emits capture-shaped
      # records, so this is a jq wrap and one POST — no SDK, no boundary crossed.
      #
      # continue-on-error because telemetry must never turn a green suite red.
      # No key configured (a fork, or before the repo variable is set) is a
      # skip, not a failure.
      - name: Report e2e flakiness to PostHog
        if: always()
        continue-on-error: true
        env:
          POSTHOG_CI_KEY: ${{ vars.POSTHOG_CI_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
          EVENTS: apps/web-pwa/e2e-flake-events.ndjson
        run: |
          set -euo pipefail
          if [ -z "${POSTHOG_CI_KEY:-}" ]; then
            echo "::notice::POSTHOG_CI_KEY is not set — skipping flake telemetry."
            exit 0
          fi
          if [ ! -s "$EVENTS" ]; then
            echo "::warning::No reporter output at $EVENTS (the run died before onEnd?) — nothing to report."
            exit 0
          fi
          echo "Shipping $(wc -l < "$EVENTS") test results to PostHog."
          jq -s --arg key "$POSTHOG_CI_KEY" '{api_key: $key, batch: .}' "$EVENTS" > /tmp/posthog-batch.json
          curl -sS --fail-with-body --max-time 30 \
            -X POST "$POSTHOG_HOST/batch/" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/posthog-batch.json

      # A FLAKY shard is green, so `failure()` never fires for it and every
      # artifact below used to be discarded — which is why `detail page — change
      # aisle` could flake in six of eight runs and leave nothing to read. The
      # failed attempt's trace, video and store snapshot are all retained on disk
      # by then (`trace: 'retain-on-failure'` keeps the attempt that actually
      # failed, not the retry that passed), so the artifacts are sitting there;
      # only the upload condition was throwing them away.
      #
      # Reads the reporter's NDJSON rather than a Playwright exit code because
      # that file is the only place the flaky/passed distinction survives.
      - name: Detect e2e flakes
        id: e2e_flakes
        if: always()
        env:
          EVENTS: apps/web-pwa/e2e-flake-events.ndjson
        run: |
          set -euo pipefail
          found=false
          if [ -s "$EVENTS" ] && jq -e -s 'any(.[]; .properties.status == "flaky")' "$EVENTS" >/dev/null; then
            found=true
            echo "::warning::Shard ${{ matrix.shard }} had retry-recovered flakes — uploading diagnostics."
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # The two server-side logs, which nothing has ever uploaded. The emulator
      # log is written by globalTeardown BEFORE `down -v` (it is the only moment
      # it exists); the Vite log is the CI-only server log globalSetup already
      # redirects to /tmp. Copied into the workspace so the upload path is
      # relative like every other artifact here.
      - name: Collect e2e server logs
        if: always()
        run: |
          set -euo pipefail
          cp /tmp/e2e-vite.log apps/web-pwa/e2e-vite.log 2>/dev/null || true
          # Fallback for the worst case: Playwright died before globalTeardown,
          # so nothing captured the container — and a run that crashed outright
          # is precisely when the emulator log is worth having. The stack is
          # probably still up in that case, so ask it directly. A no-op when
          # teardown already did its job (the file is non-empty) or when the
          # container is genuinely gone.
          if [ ! -s apps/web-pwa/e2e-emulator.log ]; then
            echo "::warning::No emulator log from globalTeardown — attempting a late capture."
            docker compose -f docker/test-emulators/docker-compose.test.yml \
              logs --no-color --timestamps > apps/web-pwa/e2e-emulator.log 2>/dev/null || true
          fi
          ls -l apps/web-pwa/e2e-emulator.log apps/web-pwa/e2e-vite.log 2>/dev/null || true

      # Hermeticity guard (issue #686). Under FUNCTIONS_AI_FAKE the stack is meant
      # to make no AI network calls at all: the dummy GEMINI_API_KEY is there only
      # to satisfy the plugin's presence check. A flow that still reaches Gemini
      # fails fast here (400) and so hides in the noise, but it is a live external
      # dependency in the suite — on slower egress the same call is a 20s
      # withAiTimeout stall per invocation, i.e. a flake with no obvious cause.
      #
      # A hit means a newly-reached flow is missing its fake seam: swap its model
      # for `flowModel(...)` (src/ai/fakeModel.ts) or short-circuit the call the
      # way embedText does (src/ai/fakeEmbedding.ts).
      - name: Assert no live AI calls
        if: always()
        env:
          LOG: apps/web-pwa/e2e-emulator.log
        run: |
          set -euo pipefail
          if [ ! -s "$LOG" ]; then
            echo "::warning::No emulator log — cannot check for live AI calls."
            exit 0
          fi
          if grep -q 'generativelanguage.googleapis.com' "$LOG"; then
            grep -o 'https://generativelanguage.googleapis.com[^"]*' "$LOG" | sort | uniq -c
            echo "::error::The e2e stack called the real Gemini API — a flow is missing its FUNCTIONS_AI_FAKE seam."
            exit 1
          fi
          echo "No live Gemini traffic in the emulator log."

      # Hermeticity guard (issue #749). The emulator has no GCP backend to talk to
      # (project demo-salt), so nothing in the stack should ever resolve GCP
      # credentials. It used to: the emulator sets K_SERVICE per function worker,
      # which made enableFirebaseTelemetry() treat the process as deployed GCP and
      # reach the GCE metadata server. Under Docker Desktop for Mac that address
      # swallows packets, so the promise never settled and every Genkit flow blocked
      # behind it — the entire local AI e2e surface was deterministically red while
      # CI stayed green, which is exactly how a real regression gets waved through.
      #
      # This asserts the INVARIANT (nothing reaches for GCP credentials) rather than
      # the code shape, so it also catches a different code path acquiring them
      # later. A hit means something re-enabled a GCP-authenticated client under the
      # emulator: gate it on FUNCTIONS_EMULATOR the way index.ts does the telemetry
      # boot, not by making the lookup fail faster.
      - name: Assert no GCP metadata calls
        if: always()
        env:
          LOG: apps/web-pwa/e2e-emulator.log
        run: |
          set -euo pipefail
          if [ ! -s "$LOG" ]; then
            echo "::warning::No emulator log — cannot check for GCP metadata calls."
            exit 0
          fi
          if grep -qE '169\.254\.169\.254|metadata\.google\.internal' "$LOG"; then
            grep -nE '169\.254\.169\.254|metadata\.google\.internal' "$LOG" | head -20
            echo "::error::The e2e stack reached the GCE metadata server — something is resolving GCP credentials under the emulator (see issue #749)."
            exit 1
          fi
          echo "No GCE metadata traffic in the emulator log."

      - name: Upload Playwright report
        if: failure() || steps.e2e_flakes.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web-pwa/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure() || steps.e2e_flakes.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: apps/web-pwa/test-results/
          retention-days: 14

      - name: Upload e2e server logs
        if: failure() || steps.e2e_flakes.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs-shard-${{ matrix.shard }}
          path: |
            apps/web-pwa/e2e-emulator.log
            apps/web-pwa/e2e-vite.log
            apps/web-pwa/e2e-flake-events.ndjson
          if-no-files-found: ignore
          retention-days: 14

  # Aggregator. MUST stay named "E2E (Playwright)" — that exact string is a
  # required status check in the "Main branch" ruleset, and sharding renamed the
  # real jobs ("E2E shard 1/3", …), so without this the required context would
  # never report and every PR would block forever.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    # `always()` because a plain `needs` SKIPS on dependency failure, and GitHub
    # counts a skipped required check as PASSING — the gate would silently stop
    # gating. Asserts the result itself instead.
    if: always()
    steps:
      - name: Verify the e2e shards passed
        env:
          # For a matrix job this is the AGGREGATE result across all shards:
          # success only if every shard succeeded.
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          set -euo pipefail
          echo "e2e-shard: $RESULT"
          # `skipped` is how a non-app PR / behind-main branch passes this
          # required check, matching the pre-shard behaviour — so the assertion is
          # "did not fail", not "succeeded".
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            echo "::error::E2E did not pass (shards: $RESULT)"
            exit 1
          fi
          echo "E2E OK."
