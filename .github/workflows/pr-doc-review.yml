name: PR Doc Review

# Reviews documentation for ONE pull request, at the moment it becomes ready
# for review. Replaces the nightly batch job (deleted in the same commit), which
# reviewed 24 hours of unrelated commits at 2 AM and reported the result the
# next morning, detached from the change that caused it.
#
# Why `[opened, ready_for_review]` and NOT `synchronize`:
#   `.claude/commands/salt-run.md` opens the PR as a DRAFT at phase 1, pushes once
#   per phase while it stays draft, and calls `gh pr ready` exactly once at the
#   final phase. So `ready_for_review` fires exactly once per /salt-run PR, after the
#   last phase and before the human review — the moment the findings are still
#   actionable. `opened` (with the draft==false guard below) covers PRs opened
#   directly as non-draft. Adding `synchronize` would fire on every phase push,
#   which is the batching-adjacent waste this workflow exists to avoid.
#   The doc commit this job pushes therefore does NOT re-trigger it: no loop.
#
# Why plain `pull_request` and NOT `pull_request_target`:
#   Deliberate departure from autofix.yml. That workflow needs the base-branch
#   context only because GitHub denies Dependabot access to Actions secrets on a
#   plain `pull_request` event. This job explicitly skips Dependabot, and every
#   /salt-run PR is same-repo, so plain `pull_request` gets secrets fine and avoids
#   the known footgun of running head code in the base context. autofix.yml's
#   same-repo guard is kept regardless.
#
# Why a GitHub App token for the push (copied wholesale from autofix.yml, which
# documents every trap):
#   The `main` ruleset uses strict required status checks. A push authored by
#   the default GITHUB_TOKEN does NOT re-trigger workflows, so a doc commit made
#   with it would strand the PR on a head SHA with no CI status and block the
#   merge forever. An App installation token is a distinct identity whose push
#   DOES re-trigger CI. `AUTOFIX_APP_ID` / `AUTOFIX_APP_PRIVATE_KEY` already
#   exist — no new setup. Accepted cost: one extra full CI run (ci.yml's
#   `changes` job classifies the whole base...head diff, so the heavy suites
#   re-run) on the ~weekly PR that actually has doc drift.
#
# Why this job NEVER fails:
#   A red X on advisory work is indistinguishable from a broken workflow, which
#   is how three nightly failures went unnoticed for a week. The review step is
#   `continue-on-error` and the degrade step turns budget/turn exhaustion into a
#   comment saying so. From here on, a red PR Doc Review means the WORKFLOW is
#   broken — which is the only thing you can act on.
#
# KNOWN BLIND SPOT — this workflow cannot review the PR that edits it:
#   claude-code-action refuses to run unless this file is byte-identical to the
#   copy on the default branch (an anti-exfiltration guard: otherwise a PR could
#   rewrite the prompt and walk off with the secrets). So any PR touching this
#   file gets a SKIPPED review, including the PR that introduced it — it starts
#   working on the first PR after merge. The `degrade` step below tells that
#   state apart from a real review and stays silent on the PR rather than
#   claiming either "cut short" or, by silence, "checked and clean".
#   This is the same shape as the blind spot ci.yml documents for changes to its
#   own e2e/integration job setup, and it has the same remedy: validate on a
#   follow-up PR that does not touch the workflow.
#
# Why the workflow, not the model, does the writing:
#   Claude only edits doc files in the working tree and leaves its report in
#   .doc-review/. The push, the PR comment and any tracking issue are done by
#   the steps below, in that fixed order, after the model has finished. A run
#   that dies mid-flight therefore cannot leave behind a claim that no fix
#   exists — the failure class that produced the orphaned, false issue #807.
#
# Why the bot's own edit is gated on the repo's docs-map check:
#   On PR #844 this job committed a CLAUDE.md edit that DELETED the Docs-map
#   pointer to a doc the same PR had just added, turning ci.yml's `Static
#   checks` red while its comment claimed the fix was already committed. It had
#   hit an internal inconsistency — a heading reading `v02 → v07` above a list
#   ending at `v08` — and resolved it in the destructive direction. The Verdict
#   A prompt now forbids that turn, but a prompt rule is not a gate: the
#   workflow runs the repo's own check on its own staged diff, between staging
#   and the App token, so a rejected edit never even mints a write credential.
#   A failed check drops the whole doc commit and says so on the PR. It never
#   reddens anything — the gate withholds a push, it does not fail the job.
#
#   `node scripts/check-docs-map.mjs`, not `pnpm docsmap:check`: the script
#   imports only node builtins and shells out to `git ls-files`, so it runs with
#   zero node_modules in well under a second. `pnpm docsmap:check` would drag in
#   the `pnpm install` this job deliberately never does — which is also why the
#   gate calls setup-node directly rather than reusing .github/actions/workspace.
#
#   Node is PINNED to 22 rather than left to the runner default, and that is not
#   cosmetic: check-docs-map.mjs uses `path.matchesGlob`, which does not exist
#   before Node 22. On an older default it would throw, exit non-zero, and
#   silently gate every doc commit forever. setup-node costs ~2s, runs no
#   install, and matches the version every other workflow here pins.
#
#   One check is the WHOLE gate, not an arbitrary sample. Root `format` /
#   `format:check` glob `**/*.{ts,js,svelte,css,html}` — markdown is outside it
#   — and lint / typecheck / depcruise cannot see a markdown-only diff. The docs
#   map is the only static check a `docs/` + `docs-map.md` + `CLAUDE.md` diff
#   can break. Do not
#   add the others: they would prove nothing and would need that install.
#
#   Warnings cannot trip it. The script exits 0 when only warnings are present
#   and 1 only on errors, so the standing dead-glob warning for Epic #778's
#   unbuilt `packages/domain/src/culture/**` is inert here. No warning
#   suppression is needed and none should be added.
#
# Why ONE repair turn, and not zero or a loop:
#   A gated run that just gives up hands mechanical work back to a human, and
#   these are mechanical: the checker names the exact problem ("`docs/x.md` is
#   not mentioned anywhere in docs-map.md"), and the fix is a row. So a
#   failed gate gets one scoped re-invocation — the model's edits are still in
#   the working tree, it is handed the checker's complaint, and it may repair
#   only what was named. Then the tree is re-staged and re-gated.
#
#   Not a loop. A second failure means the model is not converging, and the
#   right answer then is a human, not a third invocation on the same budget.
#   The drop-the-commit backstop below is what makes the repair turn safe to add
#   at all: it stays the terminal path, and it runs whenever NEITHER gate has
#   passed — including the case where the repair reverted its own work and left
#   nothing staged. The repair can only ever turn a dropped commit into a good
#   one; it can never turn a dropped commit into a bad one.
#
#   The repair step's own exit status is deliberately NOT fed through the
#   degrade classifier. Its outcome is judged solely by the re-run gate, which
#   is the only thing that actually matters: an errored, budget-exhausted or
#   skipped repair leaves the tree failing the check, the second gate says so,
#   and the commit is dropped exactly as it would have been without it.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read # the doc push uses the App token below, not GITHUB_TOKEN
  pull-requests: write # post the review comment
  issues: write # Verdict B tracking issue (final action only)
  id-token: write # required by claude-code-action for OIDC token exchange

concurrency:
  group: pr-doc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  doc-review:
    name: Doc review
    runs-on: ubuntu-latest
    # `ready_for_review` always carries draft == false; the guard is what makes
    # `opened` fire only for PRs opened directly as non-draft. Same-repo head
    # only (see autofix.yml's security note). Dependabot is skipped: its PRs
    # bump a version, they do not change what the docs describe.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'

    steps:
      # Check out the PR HEAD BRANCH (not the merge ref) so the doc commit can
      # be pushed straight back to it. persist-credentials: false — the default
      # token's http.extraheader would otherwise override the App credentials
      # embedded in the push URL and the push would 403.
      - name: Check out the PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Scope gate, mirroring ci.yml's `changes` job (the non-app allowlist
      # there). A PR landing entirely inside that allowlist gets no review at
      # all, which preserves the nightly prompt's rule that changes confined to
      # docs/ are skipped — documentation changing is not evidence that
      # documentation is stale.
      #
      # Known, accepted narrowing versus the nightly: the allowlist covers
      # `.github/`, so a PR touching ONLY `deploy-*.yml` or `chromatic.yml` no
      # longer routes to docs/releases.md or docs/visual-regression.md even
      # though the Docs map tracks those paths. Root config (pnpm-workspace.yaml,
      # root package.json, eslint.config.*, .dependency-cruiser.*) is NOT in the
      # allowlist and so still passes the gate.
      - name: Scope gate — does this PR touch anything doc-relevant?
        id: scope
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .doc-review

          # merge-base rather than the PR's recorded base.sha: it is always
          # reachable in this clone and stays correct across rebases.
          git fetch --no-tags origin main
          BASE_SHA=$(git merge-base FETCH_HEAD "$HEAD_SHA")
          echo "Diffing $BASE_SHA...$HEAD_SHA"

          git diff --name-only "$BASE_SHA...$HEAD_SHA" > .doc-review/changed-files.txt
          echo "Changed files:"
          cat .doc-review/changed-files.txt

          # Identical classification to ci.yml: everything NOT matched here
          # counts as app-impacting. Conservative by design.
          non_app=$(grep -vE '^(docs/|.*\.md$|LICENSE$|\.github/|\.claude/|\.vscode/|\.editorconfig$|\.nvmrc$|\.gitignore$|\.vexpignore$)' .doc-review/changed-files.txt || true)

          if [ -n "$non_app" ]; then
            echo "Doc-relevant changes detected — running the review."
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changes are confined to docs / CI / tooling — nothing to review."
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "### PR Doc Review — skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No file outside the non-app allowlist changed, so there is nothing a doc could have gone stale against." >> "$GITHUB_STEP_SUMMARY"
          fi

      # continue-on-error is half of the never-fail-the-job rule; the degrade
      # step below is the other half. The tool allowlist includes Grep and Glob
      # deliberately — the nightly omitted exactly those two, and matching the
      # Docs map's Tracks globs against changed files without them burnt a third
      # of the turn budget on denied calls (16-18 permission denials per run).
      - name: Review the PR's documentation impact
        id: review
        if: ${{ steps.scope.outputs.review == 'true' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 60
            --max-budget-usd 3
            --model sonnet
            --allowed-tools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(gh:*)"
          prompt: |
            You are reviewing the documentation impact of ONE pull request in the
            Salt 2.0 monorepo. You are running inside GitHub Actions on a checkout
            of the PR's head branch.

            PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            The PR's stated intent is its body. Read it with:
              gh pr view ${{ github.event.pull_request.number }} --json body --jq .body

            ## How you report — read this first

            You do NOT commit, you do NOT push, and you do NOT post comments or
            create issues. The workflow does all of that for you, in a fixed
            order, after you finish. Your job is to edit doc files in the working
            tree and to leave your report in these two files:

            - `.doc-review/comment.md` — the PR comment body. Write it for
              Verdict A and Verdict B. Leave the file ABSENT for Verdict C.
            - `.doc-review/issue.md` — a tracking issue body. Write it ONLY for a
              Verdict B whose resolution is genuinely out of scope for this PR
              (i.e. it cannot be settled by the person reviewing this diff).
              Its first line must be `TITLE: <one-line issue title>`; everything
              after that line is the issue body. Leave the file absent otherwise.

            This ordering is deliberate. It is what makes it impossible for a run
            that dies mid-flight to leave behind a claim about work it never did.

            ## Step 1 — What changed

            The PR's changed files are already listed for you in
            `.doc-review/changed-files.txt`. Read that file. Do not recompute it.

            For any file whose actual change you need to understand, inspect it on
            demand with `git diff` against the merge base — do NOT diff everything
            up front.

            ## Step 2 — Route the changed files to docs

            Read the **Docs map**, `docs-map.md` at the repo root. Its table is the single
            source of truth for which doc covers which code: the **Tracks** column
            holds the path globs, the **Read this** column the doc. This workflow
            deliberately keeps NO copy of that table — if the map and this prompt
            disagree, the map wins. Do not route from memory; read the file.

            Match each changed file against the Tracks globs (use Grep and Glob —
            they are allowed). Only proceed with the docs whose globs matched. A
            file may match several docs; review each. If NO changed file matches
            any glob, this is Verdict C — stop and follow the Verdict C
            instructions below.

            One addition the map does not cover:

            - **Root config** (`pnpm-workspace.yaml`, root `package.json`,
              `eslint.config.*`, `.dependency-cruiser.*`) → also review `CLAUDE.md`
              itself (layer map, hard rules, enforcement).

            Anything matching no glob is out of scope by construction.

            Never cite a section number from memory — `docs/salt-architecture.md`
            has been renumbered before. If you reference a section, confirm the
            number by reading its heading first.

            ## Step 3 — Read the routed docs

            Read only the docs identified in Step 2. Read each at most once.

            ## Step 4 — Classify

            For each (matched bucket → doc) pair, pick exactly one verdict:

            **A — Docs need a simple update.**
            The code change is intentional and the docs just haven't caught up.
            Examples: a new package added to the layer map; a file renamed; an
            existing convention extended in an obvious way.

            **SPECIAL CASE — UI primitives are spec, not architecture.**
            Any change under `packages/ui-components/**` is NEVER Verdict A.
            The `ui-spec-vXX.md` docs are a "no invention" contract that drives
            primitive generation; auto-amending them undermines that contract. If
            you find drift between ui-components code and a ui-spec doc, treat it
            as Verdict B and flag it for human review.

            The ui-specs are **cumulative, not superseding** (see the Docs map):
            v0.2 holds the foundations and stays in force; each later version only
            adds components. Name the spec that actually owns the changed component
            — do not assume the highest-numbered file, and never describe an older
            spec as obsolete.

            `docs/design/design.md` is also never Verdict A: its frontmatter is
            machine-consumed by `packages/ui-components/scripts/check-theme.ts`, so
            editing it changes behaviour, not prose. (The workflow reverts any edit
            to that file regardless, so editing it only wastes your turns.)

            **B — Drift, ambiguous, or a UI-spec change.**
            The code change might violate the intended architecture; or you can't
            tell whether the docs or the code should change; or the change is under
            `packages/ui-components/**`.

            **C — Everything is fine.**
            The routed docs already reflect the change accurately, or nothing
            routed at all.

            ## Step 5 — Act

            **Verdict C — say nothing.**
            Write no files at all. Print a one-paragraph summary of what you
            reviewed and why no action is needed, and stop. Silence on the PR is
            the correct outcome: a "nothing to do" comment on every PR trains the
            reader to ignore doc-review comments.

            **Verdict A — update the docs.**

            a) Edit only the doc files identified in Step 2. Keep the same tone and
               structure. No padding.

               A doc earns its place by holding what code cannot say — decisions,
               gotchas, external setup, contracts. If the change is already
               explained by a header comment next to the code, do NOT restate it in
               `docs/`; that duplication is what the map exists to prevent.

               If your update adds, renames, or removes a doc, update its row in
               `docs-map.md` in the SAME edit — a doc missing from the
               map is invisible to agents and to this job.

               NEVER delete a pointer to a doc that still exists on disk — not a
               Docs map row, not a bullet, not a link. That is the one edit to
               `docs-map.md` that can do real damage: neither `docs/` nor the map
               itself is auto-loaded,
               so removing a live doc's only pointer does not merely make it
               harder to find, it makes it invisible to every agent.

               When a heading and a list disagree, the file on disk is the truth.
               A heading reading "v02 → v07" above a list whose last entry is v08
               is a stale HEADING, not a spurious entry: bump the heading, do not
               delete the entry. Resolving that inconsistency the other way is
               exactly the mistake that broke PR #844.

               Your edits are checked before they are committed. The workflow runs
               `node scripts/check-docs-map.mjs` on your staged diff, and if it
               fails, your entire doc commit is thrown away and the PR is told so.
               A dropped commit is a wasted run, so get the map right first time.

               Only `docs/**`, `docs-map.md` and `CLAUDE.md` are committed by the
               workflow. Edits
               anywhere else are discarded, so do not make them.

            b) Write `.doc-review/comment.md`. Open it with a `## 📝 Doc review`
               heading, then say which docs you changed and, for each, which change
               in this PR made the old wording wrong. Keep it short enough to read
               alongside the code diff. State plainly that the fix is already
               committed to this branch.

            **Verdict B — flag it, change nothing.**

            Do NOT edit any file under `docs/`, nor `docs-map.md` or `CLAUDE.md`.

            Write `.doc-review/comment.md` with a `## ⚠️ Possible doc/code drift`
            heading and three sections:
              - **What changed** — the files in this PR that triggered this, and
                what they did.
              - **Why this needs a human decision** — specifically what looks like
                drift, which doc or rule it conflicts with, and why you could not
                confidently update the docs to match. For a `packages/ui-components/**`
                change, say explicitly that UI-spec docs are never auto-edited.
              - **Recommendation** — what you think the right resolution is (fix
                the code, update the docs, or investigate further) and why.

            Additionally write `.doc-review/issue.md` ONLY if resolving this is
            genuinely out of scope for this PR — i.e. it needs work that does not
            belong in this diff. If the reviewer of this PR could reasonably settle
            it here, the comment alone is the right artefact and no issue is
            needed. Remember its `TITLE:` first line.

      # The other half of the never-fail rule. There are THREE outcomes to tell
      # apart, and conflating any two of them produces a false claim on the PR:
      #
      #   ran + finished   — execution_file's final `result` message has
      #                      subtype "success". Trust whatever the model left
      #                      behind in .doc-review/.
      #   ran + cut short  — the step failed (continue-on-error caught it), or
      #                      the subtype is an error (`error_max_turns` is what
      #                      killed the nightly three times). Findings, if any,
      #                      are partial and must be labelled as such.
      #   never ran        — the step reports success but produced no
      #                      execution_file, because claude-code-action skipped
      #                      itself. Say nothing on the PR: "cut short" would be
      #                      false, and silence-as-usual would imply the docs
      #                      were checked and found fine. Job summary only.
      #
      # That third state is not hypothetical. The action refuses to run when the
      # workflow file differs from the copy on the default branch — an
      # anti-exfiltration guard — so ANY PR that edits this file gets a skipped
      # review. Its own introducing PR included; it starts working once merged.
      # Same shape as the blind spot ci.yml documents for its own job setup.
      - name: Classify how the review ended
        id: degrade
        if: ${{ steps.scope.outputs.review == 'true' }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          STEP_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -euo pipefail
          subtype=""
          ran="false"
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            ran="true"
            subtype=$(jq -r 'if type == "array" then . else [.] end | map(select(.type == "result")) | last | .subtype' "$EXECUTION_FILE" 2>/dev/null || true)
          fi
          case "$subtype" in null) subtype="" ;; esac

          if [ "$STEP_OUTCOME" != "success" ]; then
            # A hard failure is a genuine cut-short even if no transcript survived.
            ran="true"
            state="truncated"
            detail="${subtype:-the review step failed}"
          elif [ "$ran" != "true" ]; then
            state="skipped"
            detail="claude-code-action did not run (most likely because this PR edits the workflow file)"
          elif [ -n "$subtype" ] && [ "$subtype" != "success" ]; then
            state="truncated"
            detail="$subtype"
          else
            state="complete"
            detail="${subtype:-success}"
          fi

          echo "Review ended: $state ($detail; step outcome: $STEP_OUTCOME)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      # Mechanical backstop for the two never-auto-edit rules, so they do not
      # rest on the prompt alone: docs/design/design.md is reverted outright
      # (its frontmatter is machine-consumed), and only docs/, docs-map.md and
      # CLAUDE.md are
      # ever staged, so an edit anywhere else — packages/ui-components/**
      # included — is simply never committed.
      - name: Stage the doc changes, if any
        id: diff
        if: ${{ steps.scope.outputs.review == 'true' }}
        run: |
          set -euo pipefail
          git checkout -- docs/design/design.md 2>/dev/null || true
          git add -- docs docs-map.md CLAUDE.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No doc changes to commit."
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "Doc changes staged:"
            git diff --cached --name-only
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi

      # Node 22 specifically — see the header note; the checker uses
      # `path.matchesGlob`, which does not exist before it. No `cache: pnpm` and
      # no install: this job has no node_modules and the checker needs none.
      - name: Set up Node for the docs-map check
        if: ${{ steps.diff.outputs.dirty == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # THE GATE (#847). The bot's own edit has to satisfy the same docs-map
      # rule as the PR it is reviewing. It sits between staging and the App
      # token so a rejected edit never mints a write credential.
      #
      # The checker's inputs are exactly what is staged: it reads docs-map.md from
      # the working tree and its file universe from `git ls-files`, which is the
      # index — so a doc the bot created and staged is seen, and its missing map
      # row is caught. Never fails the job; the verdict leaves as an output.
      - name: Validate the staged doc edit against the docs map
        id: gate
        if: ${{ steps.diff.outputs.dirty == 'true' }}
        run: |
          set -uo pipefail
          if node scripts/check-docs-map.mjs > .doc-review/docsmap.txt 2>&1; then
            echo "docsmap-ok=true" >> "$GITHUB_OUTPUT"
            echo "The docs map check passed on the bot's own edit."
          else
            echo "docsmap-ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The doc review's own edit fails the docs map check — one repair turn follows."
            # Snapshot the rejected edit HERE rather than at drop time, so the
            # PR comment can always show what was proposed — including when the
            # repair below reverts its own work and leaves nothing staged.
            git diff --cached > .doc-review/rejected.diff || true
            git diff --cached --name-only > .doc-review/rejected-files.txt || true
          fi
          cat .doc-review/docsmap.txt
          exit 0

      # ONE repair turn — see the header note. The model's failed edits are
      # still in the working tree; it is handed the checker's complaint and may
      # fix only what was named. continue-on-error and no degrade wiring: an
      # errored or budget-exhausted repair simply leaves the tree still failing,
      # and the re-gate below drops the commit exactly as it would have anyway.
      - name: Repair the doc edit that failed the docs map check
        id: repair
        if: ${{ steps.gate.outputs.docsmap-ok == 'false' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deliberately a fraction of the review step's budget: this is one
          # mechanical fix to a named problem, not a fresh review. No gh — the
          # repair never reads the PR or writes to it. node is allowed so it can
          # re-run the checker on itself before handing back.
          claude_args: >-
            --max-turns 15
            --max-budget-usd 1
            --model sonnet
            --allowed-tools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(node:*)"
          prompt: |
            You are repairing a documentation edit you have ALREADY made. You are
            running inside GitHub Actions on a checkout of the head branch of
            PR #${{ github.event.pull_request.number }}.

            Your edits are already in the working tree. They FAILED the repo's
            docs-map check, so they will be thrown away — and the PR told that
            nothing was committed — unless you fix them now. You get ONE attempt.

            - The checker's complaint is in `.doc-review/docsmap.txt`. Read it.
            - What you changed: `git diff --cached`.
            - The checker is `node scripts/check-docs-map.mjs`. You may run it
              yourself, as many times as you need, to confirm your repair.

            It asks three questions of the Docs map table in `docs-map.md`:
            does every doc the map links to still exist; does every row's Tracks
            glob still match a tracked file; and does every doc on disk appear
            somewhere in the map. It exits 0 on warnings and 1 only on errors, so
            a standing warning is not your problem — fix only the errors.

            Repair ONLY what the checker names:

            - Do NOT expand scope. No new findings, no tidying, no rewording, no
              touching a file the checker did not put you in.
            - NEVER fix it by deleting a pointer to a doc that still exists on
              disk. If a heading and a list disagree, the file on disk is the
              truth: bump the heading and KEEP the entry. Deleting the entry is
              what broke PR #844 and is the reason this step exists.
            - Only `docs/**`, `docs-map.md` and `CLAUDE.md` are ever committed. Editing
              anything
              else is wasted work.
            - If your repair changes what you claimed, rewrite
              `.doc-review/comment.md` so it stays true. Do not mention the
              repair itself — the PR does not need to know it happened.

            If you cannot fix it without expanding scope, change nothing and
            stop. The workflow will drop the whole doc commit, which is the
            correct outcome and a better one than a bad commit.

      # Phase 1's staging step, repeated verbatim on the repaired tree — same
      # two mechanical rules: design.md reverted outright, only docs/, docs-map.md
      # and CLAUDE.md staged. `dirty=false` here means the repair reverted its
      # own work, which is a legitimate "I could not fix this" and falls through
      # to the drop.
      - name: Re-stage the repaired doc changes
        id: restage
        if: ${{ steps.gate.outputs.docsmap-ok == 'false' }}
        run: |
          set -euo pipefail
          git checkout -- docs/design/design.md 2>/dev/null || true
          git add -- docs docs-map.md CLAUDE.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "The repair left nothing staged — nothing to re-check."
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "Repaired doc changes staged:"
            git diff --cached --name-only
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi

      # The second and final gate. Identical logic to the first; a pass here is
      # what lets the commit through, and it is the ONLY thing the repair step's
      # outcome is judged by.
      - name: Validate the repaired doc edit against the docs map
        id: gate2
        if: ${{ steps.restage.outputs.dirty == 'true' }}
        run: |
          set -uo pipefail
          if node scripts/check-docs-map.mjs > .doc-review/docsmap.txt 2>&1; then
            echo "docsmap-ok=true" >> "$GITHUB_OUTPUT"
            echo "The repair worked — the docs map check now passes."
            {
              echo "### PR Doc Review — the bot repaired its own doc edit"
              echo ""
              echo "The first attempt failed \`node scripts/check-docs-map.mjs\`; one repair turn fixed it and the commit went ahead. Nothing about this appears on the PR."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docsmap-ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The repair did not fix the docs map check — dropping the doc commit."
            # Overwrite the snapshot: the post-repair diff is the one that was
            # finally rejected, so it is the one worth showing.
            git diff --cached > .doc-review/rejected.diff || true
            git diff --cached --name-only > .doc-review/rejected-files.txt || true
          fi
          cat .doc-review/docsmap.txt
          exit 0

      # THE TERMINAL BACKSTOP. Reached when the first gate failed and the repair
      # did not rescue it — either it produced a still-failing edit, or it left
      # nothing staged at all (gate2 skipped, output empty). Unstaging alone
      # would leave the bad edit in the working tree for a later step to
      # re-stage, so the files go back to their committed state outright.
      # Anything the model CREATED stays untracked and is therefore never
      # committed either. The rejected diff was snapshotted by whichever gate
      # last failed — it is what the PR comment offers you in place of a commit.
      - name: Drop the doc changes that failed the docs map check
        if: ${{ steps.gate.outputs.docsmap-ok == 'false' && steps.gate2.outputs.docsmap-ok != 'true' }}
        run: |
          set -uo pipefail
          git reset --quiet || true
          git checkout -- docs docs-map.md CLAUDE.md 2>/dev/null || true
          echo "Reverted docs/, docs-map.md and CLAUDE.md — nothing will be committed or pushed."
          {
            echo "### PR Doc Review — proposed doc edits were NOT committed"
            echo ""
            echo "They failed \`node scripts/check-docs-map.mjs\`:"
            echo ""
            echo '```'
            cat .doc-review/docsmap.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Minted late, only once a doc diff exists AND some gate has passed it —
      # the PR head code has finished running by this point and never sees the
      # write token. The `dirty` clause is implied and therefore dropped: the
      # first gate only runs when the staging step found a diff, and the second
      # only when the re-staging step did.
      - name: Generate GitHub App token
        if: ${{ steps.gate.outputs.docsmap-ok == 'true' || steps.gate2.outputs.docsmap-ok == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - name: Commit and push the doc update
        if: ${{ steps.gate.outputs.docsmap-ok == 'true' || steps.gate2.outputs.docsmap-ok == 'true' }}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          # --no-verify: this job deliberately never runs `pnpm install`, so
          # husky has not pointed core.hooksPath at the checked-in .husky/ and
          # nothing should fire — but if that ever changes, a plain commit would
          # run lint-staged + typecheck + depcruise here and could ABORT the doc
          # commit over a failure elsewhere in the PR. Doc review must never gate
          # on those; ci.yml runs them as required checks on the pushed commit.
          git commit --no-verify -m "docs: update documentation for this PR's changes"
          # No --force: if the branch advanced meanwhile the push is rejected,
          # and the comment step below is skipped with it, so no false claim.
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:${HEAD_REF}"

      # Posted AFTER the push, so a comment claiming "the fix is committed" can
      # only exist once it actually is.
      - name: Post the review comment
        if: ${{ steps.scope.outputs.review == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          STATE: ${{ steps.degrade.outputs.state }}
          SUBTYPE: ${{ steps.degrade.outputs.detail }}
          # Same condition as the drop step: the first gate failed and the
          # repair did not rescue it. Keep the two in step.
          GATED: ${{ steps.gate.outputs.docsmap-ok == 'false' && steps.gate2.outputs.docsmap-ok != 'true' }}
        run: |
          set -euo pipefail
          body=".doc-review/comment.md"

          # The review never happened. Anything posted here would be a claim
          # about work that was not done — including silence, which on this
          # workflow means "checked, nothing to say".
          if [ "$STATE" = "skipped" ]; then
            {
              echo "### PR Doc Review — did not run"
              echo ""
              echo "$SUBTYPE. This PR has **no** documentation-review signal; that is not the same as being clean."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The gate rejected the bot's own edit, so nothing was committed. The
          # model's report is deliberately DISCARDED rather than posted here: a
          # Verdict A report states in as many words that the fix is already
          # committed to this branch, and republishing that on a run which
          # committed nothing is the precise false claim #847 exists to end. The
          # rejected diff plus the checker's complaint says the same thing,
          # verifiably, and can be applied by hand in under a minute.
          if [ "$GATED" = "true" ]; then
            # Which docs would a hand-applied version of this diff UNROUTE?
            #
            # Removing a `docs-map.md` row for a doc that is still on disk is
            # the one doc edit that does lasting damage (#1025; #921/#986
            # before it): neither `docs/` nor the map itself is auto-loaded, so
            # the row is the only thing that makes a doc visible to this job's
            # own routing step and to every agent. A bot proposes it because an
            # unfamiliar row reads to it like an orphan to tidy away.
            #
            # `check-docs-map.mjs` already catches that on the COMMITTED path —
            # it is why nothing was pushed. The invitation at the end of this
            # comment is the one path that routes AROUND the gate, by asking a
            # human to apply the rejected diff themselves. So when the diff
            # would unroute a live doc, the invitation is replaced by a warning
            # naming exactly what would be lost.
            #
            # Net effect, not raw `-` lines: a reworded row appears as one
            # removal and one addition of the same link, which is not a
            # deletion. Hence (links removed) minus (links added), narrowed to
            # targets that still exist on disk. CLAUDE.md is scanned alongside
            # docs-map.md because the map lived inside it until #1038, and the
            # checker still accepts the heading at either level.
            map_links() {
              awk -v want="$2" '
                /^diff --git / { file = $3; sub(/^a\//, "", file); next }
                file != "docs-map.md" && file != "CLAUDE.md" { next }
                /^(--- |\+\+\+ )/ { next }
                substr($0, 1, 1) != want { next }
                {
                  line = $0
                  while (match(line, /\]\([^)#]+\)/)) {
                    target = substr(line, RSTART + 2, RLENGTH - 3)
                    line = substr(line, RSTART + RLENGTH)
                    if (target !~ /^https?:/) print target
                  }
                }
              ' "$1" | sort -u
            }

            : > .doc-review/unrouted.txt
            if [ -f .doc-review/rejected.diff ]; then
              map_links .doc-review/rejected.diff '-' > .doc-review/map-removed.txt
              map_links .doc-review/rejected.diff '+' > .doc-review/map-added.txt
              comm -23 .doc-review/map-removed.txt .doc-review/map-added.txt \
                > .doc-review/map-dropped.txt
              while read -r target; do
                if [ -n "$target" ] && [ -e "$target" ]; then
                  printf '%s\n' "$target" >> .doc-review/unrouted.txt
                fi
              done < .doc-review/map-dropped.txt
            fi

            {
              echo "## 🚧 Doc review — proposed edits were **not** committed"
              echo ""
              echo "The review wanted to update this branch's documentation, but its own edit fails the repo's docs-map check — and a repair attempt did not fix it. The edit was thrown away: **nothing was committed and nothing was pushed**, so \`Static checks\` is unaffected and there is no doc fix on this branch."
              echo ""
              echo "**What the checker said** (\`node scripts/check-docs-map.mjs\`)"
              echo ""
              echo '```'
              cat .doc-review/docsmap.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
              echo ""
              echo "**What it wanted to change**"
              echo ""
              sed 's/^/- `/; s/$/`/' .doc-review/rejected-files.txt 2>/dev/null || echo "- (file list unavailable)"
              echo ""
              echo "<details><summary>The rejected diff</summary>"
              echo ""
              # A four-backtick fence: the diff is of markdown files and will
              # very often contain triple-backtick fences of its own.
              echo '````diff'
              head -n 200 .doc-review/rejected.diff 2>/dev/null || true
              echo '````'
              total=$(wc -l < .doc-review/rejected.diff 2>/dev/null || echo 0)
              if [ "$total" -gt 200 ]; then
                echo ""
                echo "_Truncated — ${total} lines in full._"
              fi
              echo ""
              echo "</details>"
              echo ""
              if [ -s .doc-review/unrouted.txt ]; then
                echo "> [!WARNING]"
                echo "> **Do not apply this diff by hand.** Its net effect on the Docs map is to delete the row for a doc that is still on disk. Neither \`docs/\` nor \`docs-map.md\` is auto-loaded, so that row is the only thing that makes the doc visible — to this job's own routing step and to every agent that reads the map. Applying this would not make the doc harder to find; it would make it invisible."
                echo ">"
                echo "> Pointers that would be lost:"
                echo ">"
                sed 's/^/> - `/; s/$/`/' .doc-review/unrouted.txt
                echo ">"
                echo "> If one of those rows genuinely is stale, retire the doc and its row together in a deliberate commit — do not take it from a diff the repo's own checker just rejected."
              else
                echo "Apply it by hand if it is right; ignore it if it is not."
              fi
              echo ""
              echo "Either way the job stays green — a red \`PR Doc Review\` means the workflow itself is broken, never that a review found something."
            } > "$body"
          fi

          if [ "$STATE" = "truncated" ]; then
            # Partial findings are still worth posting; a silent cut-short run is
            # how the nightly's three failures went unnoticed for a week.
            if [ -s "$body" ]; then
              {
                echo ""
                echo "---"
                echo ""
                echo "> ⚠️ **This review was cut short** (\`$SUBTYPE\`), so the findings above are partial."
                echo "> The job is deliberately green: a red PR Doc Review means the workflow itself is broken."
              } >> "$body"
            else
              {
                echo "## ⚠️ Doc review was cut short"
                echo ""
                echo "The review ran out of budget (\`$SUBTYPE\`) before it reached a verdict, so it has"
                echo "nothing to report — treat this PR as **unreviewed** for documentation impact rather"
                echo "than as clean."
                echo ""
                echo "> The job is deliberately green: a red PR Doc Review means the workflow itself is broken."
              } > "$body"
            fi
          fi

          if [ ! -s "$body" ]; then
            echo "Nothing to say — staying silent."
            echo "### PR Doc Review — nothing to report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr comment "$PR" --body-file "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

      # The FINAL action of the run, on purpose. The nightly created its tracking
      # issue before doing the work, so a mid-flight death left a false claim
      # behind (#807). Nothing can follow this step, so nothing can invalidate it.
      - name: Raise a tracking issue, if the resolution is out of scope
        if: ${{ steps.scope.outputs.review == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          STATE: ${{ steps.degrade.outputs.state }}
        run: |
          set -euo pipefail
          file=".doc-review/issue.md"
          if [ "${STATE:-}" = "skipped" ]; then
            echo "Review did not run — nothing to raise."
            exit 0
          fi
          if [ ! -s "$file" ]; then
            echo "No out-of-scope follow-up — no issue raised."
            exit 0
          fi
          title=$(head -n 1 "$file" | sed 's/^TITLE:[[:space:]]*//')
          if [ -z "$title" ]; then
            title="review: possible doc/code drift"
          fi
          {
            tail -n +2 "$file"
            echo ""
            echo "_Raised by PR Doc Review from ${PR_URL}._"
          } > .doc-review/issue-body.md
          # Labels are best-effort: `gh issue create` hard-fails on a label that
          # does not exist, and losing the issue entirely over a renamed label
          # would be the worst possible trade.
          #
          # There is deliberately no status label. "status: needs-review" was
          # retired with the rest of the `status:` and `priority:` set when the
          # board landed — where an issue sits is a project field now, and the
          # board is what the next line puts it on. See docs/issue-board.md.
          url=$(gh issue create --title "$title" --label "documentation" --body-file .doc-review/issue-body.md \
            || gh issue create --title "$title" --body-file .doc-review/issue-body.md)
          echo "filed $url"

          # Land it on the board with no Queue or Class, so it appears under
          # Triage awaiting a ruling rather than carrying one this job invented.
          # Best-effort in the same spirit as the labels: an issue that misses
          # the board is a nuisance, an issue never filed is a lost finding.
          number="${url##*/}"
          if [ -n "${PROJECT_TOKEN:-}" ] && [ -n "$number" ]; then
            GH_TOKEN="$PROJECT_TOKEN" node scripts/board.mjs add "$number" || echo "board add failed — triage $number by hand"
          fi
